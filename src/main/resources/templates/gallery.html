<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galéria - Képböngésző</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Képböngésző</span>
        <div class="d-flex align-items-center gap-2 text-white">
            <span th:text="${user.username}">felhasználó</span>
            <span class="badge bg-secondary" th:text="${user.role}">ROLE_USER</span>
            <span th:each="extension : ${user.allowedExtensions}" class="badge bg-info text-dark" th:text="${extension}">jpg</span>
            <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-light btn-sm" th:href="@{/admin/users}">Admin felület</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-warning btn-sm" type="submit">Kijelentkezés</button>
            </form>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h3 mb-4">Elérhető képek</h1>
    <div th:if="${#lists.isEmpty(images)}" class="alert alert-info">Jelenleg nincs megjeleníthető kép a jogosultságaid alapján.</div>
    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="filename : ${images}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top" th:src="@{/images/{filename}(filename=${filename})}" th:alt="${filename}">
                <div class="card-body">
                    <h2 class="h6 mb-1" th:text="${filename}">minta.jpg</h2>
                    <span class="badge text-bg-primary" th:text="${#strings.substringAfter(filename, '.').toUpperCase()}">JPG</span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
