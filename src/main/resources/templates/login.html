<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Belépés - Képböngésző</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Képböngésző</h1>
                    <div th:if="${param.error}" class="alert alert-danger">Hibás felhasználónév vagy jelszó.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sikeresen kijelentkeztél.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Felhasználónév</label>
                            <input class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Jelszó</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Belépés</button>
                    </form>
                </div>
            </div>
            <div class="alert alert-info mt-4 small">
                <strong>Tesztfelhasználók</strong>
                <ul class="mb-0 mt-2">
                    <li><code>admin</code> / <code>admin123</code> - minden formátum, adminisztráció</li>
                    <li><code>user_jpg</code> / <code>user123</code> - JPG és JPEG</li>
                    <li><code>user_png_gif</code> / <code>user123</code> - PNG és GIF</li>
                </ul>
            </div>
        </div>
    </div>
</main>
</body>
</html>
