<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adminisztráció - Képböngésző</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Felhasználók és jogosultságok</h1>
        <a class="btn btn-outline-primary" th:href="@{/gallery}">Vissza a galériába</a>
    </div>
    <div th:if="${param.success}" class="alert alert-success">A módosítás sikeresen mentve.</div>
    <div th:if="${param.error}" class="alert alert-danger">Érvénytelen adat vagy már létező felhasználónév.</div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Felhasználó</th><th>Szerepkör</th><th>Engedélyezett formátumok</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.username}">admin</td>
                        <td><span class="badge text-bg-secondary" th:text="${user.role}">ROLE_USER</span></td>
                        <td>
                            <form class="d-flex flex-wrap gap-3 align-items-center" th:action="@{/admin/users/{id}/permissions(id=${user.id})}" method="post">
                                <label th:each="extension : ${extensions}" class="form-check">
                                    <input class="form-check-input" type="checkbox" name="extensions" th:value="${extension}" th:checked="${user.allowedExtensions.contains(extension)}">
                                    <span class="form-check-label" th:text="${extension}">jpg</span>
                                </label>
                                <button class="btn btn-sm btn-primary" type="submit">Mentés</button>
                            </form>
                        </td>
                        <td></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h5">Új felhasználó hozzáadása</h2>
            <form class="row g-3" th:action="@{/admin/users/create}" method="post">
                <div class="col-md-3"><label class="form-label" for="username">Felhasználónév</label><input class="form-control" id="username" name="username" required></div>
                <div class="col-md-3"><label class="form-label" for="password">Jelszó</label><input class="form-control" id="password" name="password" type="password" required></div>
                <div class="col-md-2"><label class="form-label" for="role">Szerepkör</label><select class="form-select" id="role" name="role"><option value="ROLE_USER">Felhasználó</option><option value="ROLE_ADMIN">Admin</option></select></div>
                <div class="col-md-4"><label class="form-label d-block">Kezdeti formátumok</label><div class="d-flex gap-3 pt-2"><label th:each="extension : ${extensions}" class="form-check"><input class="form-check-input" type="checkbox" name="extensions" th:value="${extension}"><span class="form-check-label" th:text="${extension}">jpg</span></label></div></div>
                <div class="col-12"><button class="btn btn-success" type="submit">Felhasználó létrehozása</button></div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
